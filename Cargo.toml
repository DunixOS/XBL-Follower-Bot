[package]
name = "xbox-follower-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
percent-encoding = "2.3.1"
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dependencies.tokio]
version = "1.48.0"
features = ["rt", "macros", "rt-multi-thread", "sync", "signal"]
